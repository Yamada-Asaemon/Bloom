name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Ключ подписи (создаётся один раз)
        run: |
          if [ ! -f app/bloom.keystore ]; then
            keytool -genkeypair -v -keystore app/bloom.keystore \
              -storepass bloom123 -keypass bloom123 -alias bloom \
              -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=Bloom"
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add app/bloom.keystore
            git commit -m "Add signing keystore"
            git push
          fi

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - run: gradle assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Bloom-APK
          path: app/build/outputs/apk/release/*.apk
