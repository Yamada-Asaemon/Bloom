name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      # Постоянный ключ подписи: чтобы новые версии ставились поверх старых без потери данных
      - name: Restore debug keystore
        run: |
          mkdir -p ~/.android
          if [ -f debug.keystore.b64 ]; then base64 -d debug.keystore.b64 > ~/.android/debug.keystore; fi

      - name: Prepare icon
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          if [ -f app_icon.png ]; then cp app_icon.png app/src/main/res/drawable-nodpi/app_icon.png; fi

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Bloom-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
